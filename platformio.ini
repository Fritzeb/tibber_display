; PlatformIO-Projektkonfiguration
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Waveshare ESP32-S3 PhotoPainter nutzt N16R8 (16 MB Flash, 8 MB PSRAM, Octal-SPI).
; Falls das Board in schematik.io/PlatformIO abweichend erkannt wird, hier anpassen.
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; USB-CDC: Serial-Ausgabe laeuft ueber den nativen USB-Port des ESP32-S3.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    bblanchon/ArduinoJson @ ^7
    zinggjm/GxEPD2
    adafruit/Adafruit GFX Library
    ricmoo/QRCode
